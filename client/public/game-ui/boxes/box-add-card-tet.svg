<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="82" viewBox="0 0 86 82" fill="none">
  <defs>
    <linearGradient id="bg" x1="12" y1="6" x2="74" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F15A3A"/>
      <stop offset="1" stop-color="#D92E22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(43 44) rotate(90) scale(31 34)">
      <stop offset="0" stop-color="#FFE58A" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFC247" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB13D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="envelope" x1="32" y1="16" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4A2E"/>
      <stop offset="1" stop-color="#B90F13"/>
    </linearGradient>
    <linearGradient id="gold" x1="25" y1="14" x2="61" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1A1"/>
      <stop offset="0.45" stop-color="#F6B931"/>
      <stop offset="1" stop-color="#B86E12"/>
    </linearGradient>
    <linearGradient id="base" x1="20" y1="62" x2="66" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7C448"/>
      <stop offset="0.18" stop-color="#D8181C"/>
      <stop offset="0.78" stop-color="#B60F13"/>
      <stop offset="1" stop-color="#F2B836"/>
    </linearGradient>
    <filter id="shadow" x="15" y="9" width="58" height="68" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#6B0707" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="85" height="81" rx="13.5" fill="url(#bg)" stroke="#FFE0C9" stroke-opacity="0.9"/>
  <circle cx="43" cy="43" r="34" fill="url(#glow)"/>

  <!-- simple blossom hints in the background -->
  <g opacity="0.28" stroke="#7A221D" stroke-width="1.2" stroke-linecap="round">
    <path d="M9 21 C15 15 20 13 27 12"/>
    <path d="M79 20 C72 15 67 13 59 13"/>
  </g>
  <g opacity="0.45" fill="#FFC2A8">
    <circle cx="18" cy="15" r="2.2"/><circle cx="23" cy="13" r="1.7"/><circle cx="13" cy="20" r="1.5"/>
    <circle cx="69" cy="15" r="2"/><circle cx="74" cy="20" r="1.6"/><circle cx="62" cy="18" r="1.5"/>
  </g>

  <!-- platform -->
  <ellipse cx="43" cy="67.2" rx="27" ry="8" fill="#8F0C10" opacity="0.38"/>
  <path d="M19 65.2C19 59.6 67 59.6 67 65.2V70.4C67 76.1 19 76.1 19 70.4V65.2Z" fill="url(#base)"/>
  <ellipse cx="43" cy="65.2" rx="24" ry="6.7" fill="#F23A25" stroke="url(#gold)" stroke-width="2"/>
  <ellipse cx="43" cy="64.9" rx="19" ry="4.5" fill="#D71919" opacity="0.65"/>

  <!-- light rays -->
  <g opacity="0.65" stroke="#FFD766" stroke-width="1.4" stroke-linecap="round">
    <path d="M43 21V9"/><path d="M35 26L28 14"/><path d="M52 26L60 14"/>
    <path d="M30 41L15 35"/><path d="M56 41L71 35"/>
  </g>
  <g fill="#FFE990">
    <path d="M24 34l1.1 2.2 2.4.4-1.7 1.7.4 2.4-2.2-1.1-2.1 1.1.4-2.4-1.8-1.7 2.5-.4L24 34Z"/>
    <path d="M62 38l.8 1.5 1.7.3-1.2 1.2.3 1.7-1.6-.8-1.5.8.3-1.7-1.2-1.2 1.7-.3.7-1.5Z"/>
    <circle cx="33" cy="23" r="1.1"/><circle cx="57" cy="25" r="1"/><circle cx="27" cy="51" r="0.9"/>
  </g>

  <!-- red envelope -->
  <g filter="url(#shadow)" transform="rotate(10 43 43)">
    <rect x="31" y="18" width="27" height="43" rx="3.4" fill="url(#envelope)" stroke="#7D0B10" stroke-width="1.1"/>
    <path d="M31.6 21.8C39 30.2 49.2 30.2 57.4 21.8" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M32.4 56.5H57.1V61.2H32.4V56.5Z" fill="#A60D12" opacity="0.35"/>

    <!-- gold cloud corners -->
    <path d="M31.5 51.8c3.7-1.8 5.8.2 5.8 3.1 2.5-1.6 5 .2 4.4 3.6H31.5v-6.7Z" fill="url(#gold)"/>
    <path d="M57.7 51.7c-3.6-1.7-5.8.2-5.8 3.1-2.5-1.5-5 .3-4.4 3.7h10.2v-6.8Z" fill="url(#gold)"/>
    <path d="M34.5 55c1.2-2.7 4.8-1.3 3.9 1.7" stroke="#9F5B0E" stroke-width="1" stroke-linecap="round"/>
    <path d="M54.4 55c-1.2-2.7-4.8-1.3-3.9 1.7" stroke="#9F5B0E" stroke-width="1" stroke-linecap="round"/>

    <!-- clasp flower -->
    <g transform="translate(44.5 32.6)">
      <circle r="6.2" fill="url(#gold)"/>
      <circle r="4.8" fill="#E8311F"/>
      <circle cx="0" cy="-3.5" r="3" fill="#F64A2F" stroke="#F2C55A" stroke-width="0.7"/>
      <circle cx="3.4" cy="0" r="3" fill="#F64A2F" stroke="#F2C55A" stroke-width="0.7"/>
      <circle cx="0" cy="3.5" r="3" fill="#F64A2F" stroke="#F2C55A" stroke-width="0.7"/>
      <circle cx="-3.4" cy="0" r="3" fill="#F64A2F" stroke="#F2C55A" stroke-width="0.7"/>
      <text x="0" y="3" text-anchor="middle" font-family="serif" font-size="8" font-weight="700" fill="#FFE07A">福</text>
    </g>

    <!-- small gold flowers -->
    <g fill="#FFD260" stroke="#B56A10" stroke-width="0.35">
      <path d="M38 43c1.2-2.2 3.8-.2 1.6 1.1 2.3.6.9 3.5-.8 1.7-.6 2.4-3.6 1.1-1.8-.7-2.4-.5-1-3.4.9-1.7Z"/>
      <path d="M49 48c1-1.8 3.1-.1 1.3.9 1.9.5.7 2.9-.7 1.4-.5 2-3 .9-1.5-.6-2-.4-.8-2.8.8-1.4Z"/>
      <path d="M42 53c.8-1.5 2.6-.1 1.1.7 1.6.4.6 2.4-.6 1.2-.4 1.6-2.5.7-1.2-.5-1.7-.4-.7-2.3.6-1.1Z"/>
    </g>
    <path d="M31 18.5c7 9.2 18.2 9.3 27 0V21c-8.2 8.8-19.5 8.8-27 0v-2.5Z" fill="#FF6A3C" opacity="0.28"/>
  </g>
</svg>
