services:
  postgres:
    image: postgres:16-alpine
    container_name: logic_game2_clean_postgres
    environment:
      POSTGRES_USER: zodiac_user
      POSTGRES_PASSWORD: zodiac_password
      POSTGRES_DB: zodiac_game
    ports:
      - '25432:5432'
    volumes:
      - logic_game2_clean_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zodiac_user -d zodiac_game']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logic_game2_clean_redis
    ports:
      - '26379:6379'
    volumes:
      - logic_game2_clean_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  logic_game2_clean_postgres_data:
  logic_game2_clean_redis_data:
